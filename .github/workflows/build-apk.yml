
name: Build Android APK

on:
  workflow_dispatch:
  push:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Find and extract project
        run: |
          mkdir source
          ZIP_FILE="$(find . -maxdepth 1 -type f -iname '*.zip' | head -n 1)"
          if [ -z "$ZIP_FILE" ]; then
            echo "ZIP archive not found in repository root"
            exit 1
          fi
          unzip -q "$ZIP_FILE" -d source
          PROJECT_DIR="$(find source -name settings.gradle.kts -printf '%h\n' | head -n 1)"
          if [ -z "$PROJECT_DIR" ]; then
            echo "Gradle project not found"
            exit 1
          fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Build APK
        run: gradle -p "$PROJECT_DIR" assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: UnityDumpAndroid-debug-apk
          path: source/**/app/build/outputs/apk/debug/app-debug.apk
          
